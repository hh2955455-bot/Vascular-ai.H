<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#134e4a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="arteryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#2dd4bf" stroke-width="4" stroke-opacity="0.3" />

  <!-- Vascular Aortic Arch & Tree -->
  <g transform="translate(256, 260) scale(1.1)" filter="url(#glow)">
    <!-- Heart & Aortic Arch path -->
    <path d="M-60,70 C-120,0 -110,-70 -50,-100 C-10,-120 0,-90 0,-60 C0,-90 10,-120 50,-100 C110,-70 120,0 60,70 L0,130 Z" 
          fill="none" stroke="url(#tealGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />

    <!-- Aorta Branching vessels (Brachiocephalic, Carotid, Subclavian) -->
    <path d="M-25,-85 L-40,-135" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />
    <path d="M0,-88 L0,-145" fill="none" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" />
    <path d="M25,-85 L40,-135" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" />

    <!-- Pulse ECG wave inside -->
    <path d="M-80,10 L-40,10 L-25,-30 L-10,35 L5,-15 L18,10 L80,10" 
          fill="none" stroke="#f43f5e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Stent mesh / vascular grid points -->
    <circle cx="0" cy="80" r="6" fill="#2dd4bf" />
    <circle cx="-35" cy="50" r="5" fill="#38bdf8" />
    <circle cx="35" cy="50" r="5" fill="#38bdf8" />
  </g>

  <!-- Text brand symbol -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#2dd4bf" text-anchor="middle" letter-spacing="4">VASCULAR AI</text>
</svg>
